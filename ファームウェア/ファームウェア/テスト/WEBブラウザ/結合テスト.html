<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MMP 結合テスト (WebSocket / WebAPI / BLE / Serial 切替版)</title>
<style>
  :root{--b:#e5e7eb;--bg:#f8fafc}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;height:100vh;display:flex;flex-direction:column}
  header{padding:10px 14px;border-bottom:1px solid var(--b);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,button,select{font-size:14px;padding:6px 10px}
  input[type="number"]{width:6rem}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
  section{display:flex;flex-direction:column;min-height:0}
  h3{margin:10px}
  .panel{border-right:1px solid var(--b)}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border-bottom:1px solid var(--b);background:#fff;position:sticky;top:0;z-index:1}
  .log{flex:1;padding:10px;background:var(--bg);overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Consolas,Menlo,monospace}
  .muted{color:#6b7280}
  .btn{background:#111827;color:#fff;border:0;border-radius:8px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sec{background:#374151}
  .btn.warn{background:#b91c1c}
  .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  small{color:#6b7280}
  label.inline{display:inline-flex;gap:6px;align-items:center}
  #connStatus { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
  .disconnected { background: #fee2e2; color: #991b1b; }
  .connected { background: #dcfce7; color: #166534; }
  .api-mode-bg { background: #e0f2fe; border: 1px solid #bae6fd; padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>

<header>
  <strong>MMP 結合テスト</strong>
  <div class="group api-mode-bg">
    <label style="font-weight:bold;">通信:</label>
    <label class="inline"><input type="radio" name="commMode" value="ws" checked> WebSocket</label>
    <label class="inline"><input type="radio" name="commMode" value="api"> WebAPI</label>
    <label class="inline"><input type="radio" name="commMode" value="ble"> BLE</label>
    <label class="inline"><input type="radio" name="commMode" value="serial"> Serial</label>
  </div>
  
  <!-- WebSocket / WebAPI用コントロール -->
  <span id="netControls" class="group">
    <label class="inline">HOST/IP <input id="host" placeholder="例: 192.168.2.99" style="width:11rem"></label>
    <label class="inline">PORT <input id="port" type="number" value="8082" min="1" max="65535"></label>
    <button class="btn sec" id="btnConnect">接続</button>
    <button class="btn sec" id="btnDisconnect" disabled>切断</button>
  </span>

  <!-- BLE用コントロール -->
  <span id="bleControls" class="group" style="display:none;">
    <label class="inline">BLE名: <input id="bleName" value="MMP-BLE-MAIN" style="width:9rem"></label>
    <button class="btn sec" id="btnBleConnect">BLE接続</button>
    <button class="btn sec" id="btnBleDisconnect" disabled>切断</button>
  </span>

  <!-- Serial用コントロール -->
  <span id="serialControls" class="group" style="display:none;">
    <label class="inline">ボーレート:
      <select id="serialBaud">
        <option value="9600">9600</option>
        <option value="115200" selected>115200</option>
        <option value="921600">921600</option>
        <option value="3000000">3Mbps</option>
      </select>
    </label>
    <button class="btn sec" id="btnSerialConnect">シリアル接続</button>
    <button class="btn sec" id="btnSerialDisconnect" disabled>切断</button>
  </span>

  <span id="connStatus" class="disconnected">未接続</span>
</header>

<main>
  <!-- 左：従来ログ（Pythonのprint相当） -->
  <section class="panel">
    <div class="bar">
      <div class="group">
        <button class="btn" id="btnAnalog" disabled>１.アナログ入力</button>
        <button class="btn" id="btnDigital" disabled>２.デジタル入出力</button>
        <button class="btn" id="btnMp3List" disabled>３.ＭＰ３再生</button>
        <button class="btn" id="btnMp3Ctrl" disabled>４.ＭＰ３制御</button>
        <button class="btn" id="btnPwm" disabled>５.ＰＷＭ</button>
        <button class="btn" id="btnPwmI2C" disabled>６.Ｉ２Ｃ</button>
      </div>
      <div class="group">
        <button class="btn warn" id="btnStop">停止</button>
        <button class="btn sec" id="btnClearStd">ログ消去</button>
      </div>
    </div>
    <div class="log" id="std"></div>
  </section>

  <!-- 右：詳細ログ（URL＋レスポンス、生JSON追記） -->
  <section>
    <div class="bar">
      <div class="group">
        <button class="btn sec" id="btnInfo">ＭＭＰバージョン</button>
      </div>
      <div class="group">
        <button class="btn sec" id="btnClearDtl">ログ消去</button>
        <label class="inline"><input type="checkbox" id="chkJson"> JSON形式</label>
      </div>
    </div>
    <div class="log" id="detail"></div>
  </section>
</main>

<script>
(function(){
  const $ = sel => document.querySelector(sel);
  const hostEl = $('#host'), portEl = $('#port');
  const stdEl = $('#std'), detailEl = $('#detail');
  const statusEl = $('#connStatus');
  const netControls = $('#netControls'), wsControls = $('#wsControls');
  const bleControls = $('#bleControls'), serialControls = $('#serialControls');
  const chkJsonEl = $('#chkJson');

  hostEl.value = location.hostname || '192.168.2.99';

  let stopFlag = false;
  let ws = null;
  let bleDevice = null, bleServer = null, bleRxChar = null, bleTxChar = null;
  let serialPort = null, serialReader = null, keepReading = false;

  const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const UART_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const UART_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  function updateModeUI() {
    const mode = document.querySelector('input[name="commMode"]:checked').value;
    netControls.style.display = 'none';
    bleControls.style.display = 'none';
    serialControls.style.display = 'none';
    chkJsonEl.disabled = true;

    if (mode === 'ws') {
      netControls.style.display = 'inline-flex';
      const isConnected = (ws && ws.readyState === WebSocket.OPEN);
      setConnectedState(isConnected);
    } else if (mode === 'api') {
      netControls.style.display = 'inline-flex';
      wsControls.style.display = 'none'; // WebAPI時は接続ボタン不要
      chkJsonEl.disabled = false;
      statusEl.textContent = 'WebAPIモード';
      statusEl.className = 'connected';
      setTestButtonsEnabled(true);
    } else if (mode === 'ble') {
      bleControls.style.display = 'inline-flex';
      const isConnected = (bleServer && bleServer.connected);
      setConnectedState(isConnected);
    } else if (mode === 'serial') {
      serialControls.style.display = 'inline-flex';
      const isConnected = (serialPort && serialPort.readable);
      setConnectedState(isConnected);
    }
  }

  document.querySelectorAll('input[name="commMode"]').forEach(radio => {
    radio.onchange = updateModeUI;
  });

  function setConnectedState(connected) {
    statusEl.textContent = connected ? '接続中' : '未接続';
    statusEl.className = connected ? 'connected' : 'disconnected';
    $('#btnConnect').disabled = connected;
    $('#btnDisconnect').disabled = !connected;
    $('#btnBleConnect').disabled = connected;
    $('#btnBleDisconnect').disabled = !connected;
    $('#btnSerialConnect').disabled = connected;
    $('#btnSerialDisconnect').disabled = !connected;
    setTestButtonsEnabled(connected);
  }

  function setTestButtonsEnabled(enabled) {
    const testBtns = ['#btnAnalog', '#btnDigital', '#btnMp3List', '#btnMp3Ctrl', '#btnPwm', '#btnPwmI2C', '#btnInfo'];
    testBtns.forEach(sel => {
      const el = $(sel);
      if (el) el.disabled = !enabled;
    });
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function logStd(line=""){ stdEl.textContent += (line + "\n"); stdEl.scrollTop = stdEl.scrollHeight; }
  function logDtl(block=""){ detailEl.textContent += (block + "\n"); detailEl.scrollTop = detailEl.scrollHeight; }

  // --- WebSocket ---
  $('#btnConnect').onclick = () => {
    const host = hostEl.value.trim();
    const port = portEl.value.trim() || '8082';
    const wsUrl = `ws://${host}:${port}`;
    
    logDtl(`Connecting to ${wsUrl} ...\n`);

    try {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        logDtl(`Connected to ${wsUrl}\n`);
        setConnectedState(true);
      };
      ws.onmessage = (event) => {
        const text = event.data;
        try {
          const json = JSON.parse(text);
          logDtl(`RECV (WS):\n` + JSON.stringify(json, null, 2) + `\n`);
        } catch {
          logDtl(`RECV (WS): ${text}\n`);
        }
      };
      ws.onerror = () => { logDtl('WebSocketエラーが発生しました。\n'); };
      ws.onclose = () => {
        logDtl('Disconnected from WebSocket.\n');
        setConnectedState(false);
        ws = null;
      };
    } catch(e) {
      logDtl(`ERROR: ${e?.message || e}\n`);
    }
  };

  $('#btnDisconnect').onclick = () => { if (ws) ws.close(); };

  // --- Web Bluetooth (BLE) ---
  $('#btnBleConnect').onclick = async () => {
    const targetName = $('#bleName').value.trim() || 'MMP-BLE-MAIN';
    logDtl(`BLEスキャン中 (${targetName}) ...\n`);

    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: targetName }],
        optionalServices: [UART_SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => {
        logDtl('BLE切断されました。\n');
        setConnectedState(false);
        bleServer = null;
      });

      logDtl('GATTサーバー接続中...\n');
      bleServer = await bleDevice.gatt.connect();

      const service = await bleServer.getPrimaryService(UART_SERVICE_UUID);
      bleRxChar = await service.getCharacteristic(UART_RX_UUID);
      bleTxChar = await service.getCharacteristic(UART_TX_UUID);

      await bleTxChar.startNotifications();
      bleTxChar.addEventListener('characteristicvaluechanged', (e) => {
        const text = new TextDecoder('utf-8').decode(e.target.value);
        logDtl(`RECV (BLE): ${text}\n`);
      });

      logDtl(`BLE接続完了: ${bleDevice.name}\n`);
      setConnectedState(true);
    } catch(e) {
      logDtl(`BLE接続エラー: ${e?.message || e}\n`);
    }
  };

  $('#btnBleDisconnect').onclick = () => {
    if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
    setConnectedState(false);
  };

  // --- Web Serial ---
  $('#btnSerialConnect').onclick = async () => {
    const baudRate = parseInt($('#serialBaud').value, 10) || 115200;
    logDtl(`シリアルポート選択中 ...\n`);

    try {
      serialPort = await navigator.serial.requestPort();
      await serialPort.open({ baudRate: baudRate });

      logDtl(`シリアル接続完了 (${baudRate} bps)\n`);
      setConnectedState(true);

      keepReading = true;
      readSerialLoop();
    } catch(e) {
      logDtl(`シリアル接続エラー: ${e?.message || e}\n`);
    }
  };

  async function readSerialLoop() {
    const textDecoder = new TextDecoderStream();
    serialPort.readable.pipeTo(textDecoder.writable);
    const serialReader = textDecoder.readable.getReader();

    try {
      while (keepReading) {
        const { value, done } = await serialReader.read();
        if (done) break;
        if (value) {
          logDtl(`RECV (Serial): ${value}`);
        }
      }
    } catch (error) {
      logDtl(`シリアル読込エラー: ${error}\n`);
    } finally {
      serialReader.releaseLock();
    }
  }

  $('#btnSerialDisconnect').onclick = async () => {
    keepReading = false;
    if (serialPort) {
      try { await serialPort.close(); } catch(e){}
      serialPort = null;
    }
    setConnectedState(false);
    logDtl('シリアル切断されました。\n');
  };

  async function fetchWithTimeout(url, ms=10000){
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), ms);
    try{
      const res = await fetch(url, {signal: ctrl.signal, cache:'no-store'});
      clearTimeout(t);
      return res;
    }catch(e){
      clearTimeout(t);
      throw e;
    }
  }

  // APIリクエスト（WebSocket / WebAPI / BLE / Serial 自動切替）
  async function apiGet(path){
    const mode = document.querySelector('input[name="commMode"]:checked').value;
    let text='', status=200, ok=true, json=null, err=null;

    let wsMsg = path;
    if (!wsMsg.startsWith('/')) wsMsg = '/' + wsMsg;
    if (!wsMsg.endsWith('!')) wsMsg += '!';

    if (mode === 'ws') {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        err = 'WebSocketが接続されていません。';
        logDtl(`ERROR: ${err}\n`);
        return {ok: false, status: 0, text: '', json: null, err};
      }
      logDtl(`SEND (WS): ${wsMsg}`);
      ws.send(wsMsg);
      await sleep(150);
      return {ok: true, status: 200, text: '{"ok":true}', json: {ok: true, value: 0}, err: null};

    } else if (mode === 'ble') {
      if (!bleServer || !bleServer.connected || !bleRxChar) {
        err = 'BLEが接続されていません。';
        logDtl(`ERROR: ${err}\n`);
        return {ok: false, status: 0, text: '', json: null, err};
      }
      logDtl(`SEND (BLE): ${wsMsg}`);
      await bleRxChar.writeValueWithoutResponse(new TextEncoder().encode(wsMsg));
      await sleep(150);
      return {ok: true, status: 200, text: '{"ok":true}', json: {ok: true, value: 0}, err: null};

    } else if (mode === 'serial') {
      if (!serialPort || !serialPort.writable) {
        err = 'シリアルが接続されていません。';
        logDtl(`ERROR: ${err}\n`);
        return {ok: false, status: 0, text: '', json: null, err};
      }
      logDtl(`SEND (Serial): ${wsMsg}`);
      const writer = serialPort.writable.getWriter();
      await writer.write(new TextEncoder().encode(wsMsg + '\n'));
      writer.releaseLock();
      await sleep(150);
      return {ok: true, status: 200, text: '{"ok":true}', json: {ok: true, value: 0}, err: null};

    } else {
      const host = hostEl.value.trim();
      const port = (portEl.value || '8080').trim();
      
      const suffix = chkJsonEl.checked ? '@!' : '!';
      const url  = `http://${host}:${port}${path}${suffix}`;
      
      try{
        const res = await fetchWithTimeout(url);
        status = res.status; text = await res.text();
        try{ json = JSON.parse(text); }catch(_){}
        ok = res.ok;
      }catch(e){ err = e?.message || String(e); }

      let block = `GET ${url}\n`;
      if (err){
        block += `ERROR: ${err}\n`;
      }else{
        block += `HTTP ${status}\n`;
        block += json ? JSON.stringify(json, null, 2) : (text || '(空)');
      }
      logDtl(block + "\n");
      return {ok, status, text, json, err};
    }
  }

  // ===== Pythonロジック移植 =====

  async function RunAnalog(){
    stopFlag = false;
    logStd("１.アナログ入力（ HC4067：JoyPad1,2 ）");

    {
      const r = await apiGet(`/ANALOG/SETUP:2:4`);
      logStd(" ・アクセス範囲指定 → [2,4]  : " + ((r.json&&r.json.ok) ? "True":"False"));
      if (!(r.json&&r.json.ok)){ logStd("  <<中断>>\n"); return; }
    }

    {
      const r = await apiGet(`/ANALOG/INPUT`);
      logStd(" ・アナログ値をバッファに格納 : " + ((r.json&&r.json.ok) ? "True":"False"));
      if (!(r.json&&r.json.ok)){ logStd("  <<中断>>\n"); return; }
    }

    logStd(" ・バッファを参照");
    for (let x=0; x<=1; x++){
      logStd(`  JoyPad[${x+1}]`);
      for (let y=0; y<=3; y++){
        const r = await apiGet(`/ANALOG/READ:${x}:${y}`);
        const v = (r.json&&typeof r.json.value!=="undefined") ? r.json.value : "NaN";
        logStd(`   ← [${y}] = ${v}`);
        if (stopFlag) return;
      }
    }
    logStd(" [終了]\n");
  }

  async function RunDigital(){
    let pin1 = [18, 14, 13];
    let pin2 = 17;

    stopFlag = false;
    logStd("２.デジタル入出力（ GPIO ）");
    logStd(" ・入力");
    for (let pin of pin1){
      const r = await apiGet(`/DIGITAL/INPUT:${pin}`);
      const val = (r.json && typeof r.json.value!=="undefined") ? r.json.value : 1;
      logStd(`  ←[${pin}] = ${val==0 ? "ON":"OFF"}`);
      if (stopFlag) return;
    }

    logStd(` ・出力[${pin2}]`);
    for (let i = 0; i < 6; i++) {
      const r1 = await apiGet(`/DIGITAL/OUTPUT:${pin2}:1`);
      logStd(`  → HIGH : ${r1.json && r1.json.ok ? "True" : "False"}`); if (stopFlag) return;
      await sleep(500); if (stopFlag) return;

      const r0 = await apiGet(`/DIGITAL/OUTPUT:${pin2}:0`);
      logStd(`  → LOW  : ${r0.json && r0.json.ok ? "True" : "False"}`); if (stopFlag) return;
      await sleep(500); if (stopFlag) return;
    }
    logStd(" [終了]\n");
  }

  async function RunMp3Playlist(){
    stopFlag = false;
    logStd("３.ＭＰ３再生（ DFPlayer ）");

    await sleep(100); let r = await apiGet(`/MP3/SET/VOLUME:1:20`);
    logStd(" ・音量 → 20 : " + (r.json&&r.json.ok ? "True":"False"));

    await sleep(100); r = await apiGet(`/MP3/SET/LOOP:1:0`);
    logStd(` ・ループ → OFF : ${r.json?r.json.value:"NaN"}`);

    logStd(" ・再生");
    for (let track=1; track<=3; track++){
      await sleep(100); const r = await apiGet(`/MP3/PLAYF:1:1:${track}`);
      logStd(`  → F=1,T=${track} : ${r.json?r.json.value:"NaN"}`);
      if (stopFlag) return;
      await sleep(3000); if (stopFlag) return;
    }

    await sleep(100); r = await apiGet(`/MP3/STOP:1`);
    logStd(` ・停止 : ${r.json?r.json.value:"NaN"}`);

    await sleep(100); r = await apiGet(`/MP3/PLAYF:1:2:102`);
    logStd(` ・再生 → F=2,T=102 : ${r.json?r.json.value:"NaN"}`);

    await sleep(100); r = await apiGet(`/MP3/SET/LOOP:1:1`);
    logStd(` ・ループ → ON : ${r.json?r.json.value:"NaN"}`);
    if (stopFlag) return;
    await sleep(10000); if (stopFlag) return;

    await sleep(100); r = await apiGet(`/MP3/STOP:1`);
    logStd(` ・停止 : ${r.json?r.json.value:"NaN"}`);

    logStd(" [終了]\n");
  }

  async function RunMp3Control(){
    stopFlag = false;
    logStd("４.ＭＰ３制御（ DFPlayer ）");

    await sleep(100); let r = await apiGet(`/MP3/SET/VOLUME:1:20`);
    logStd(" ・音量 20      : " + (r.json&&r.json.ok ? "True":"False"));

    await sleep(100); r = await apiGet(`/MP3/PLAYF:1:4:1`);
    logStd(` ・再生 F=4,T=1 : ${r.json?r.json.value:"NaN"}`);

    await sleep(100); r = await apiGet(`/MP3/SET/LOOP:1:0`);
    logStd(` ・ループ OFF   : ${r.json?r.json.value:"NaN"}`);

    logStd(" ・参照");
    await sleep(100); let st = await apiGet(`/MP3/INFO/TRACK:1`   ); 
    await sleep(100); let vv = await apiGet(`/MP3/INFO/VOLUME:1`  );
    await sleep(100); let eq = await apiGet(`/MP3/INFO/EQ:1`      );
    await sleep(100); let fc = await apiGet(`/MP3/INFO/FILES:1`   );
    await sleep(100); let fn = await apiGet(`/MP3/INFO/FILEID:1`  );
    logStd(`  ・トラック状況 = ${st.json?st.json.value:"NaN"}`);
    logStd(`  ・音量         = ${vv.json?vv.json.value:"NaN"}`);
    logStd(`  ・イコライザ   = ${eq.json?eq.json.value:"NaN"}`);
    logStd(`  ・総ファイル数 = ${fc.json?fc.json.value:"NaN"}`);
    logStd(`  ・現在ファイル = ${fn.json?fn.json.value:"NaN"}`);

    await sleep(100); r = await apiGet(`/MP3/PAUSE:1`);
    logStd(` ・一時停止 : ${r.json?r.json.value:"NaN"}`);

    if (stopFlag) return;
    await sleep(2000); if (stopFlag) return;

    await sleep(100); r = await apiGet(`/MP3/START:1`);
    logStd(` ・再開     : ${r.json?r.json.value:"NaN"}`);

    logStd(" ・イコライザー");
    for (let m=0; m<=5; m++){
      await sleep(100); r = await apiGet(`/MP3/SET/EQ:1:${m}`);
      logStd(`  [${m}] ${(r.json&&r.json.ok)?"True":"False"}`);
      if (stopFlag) return;
      await sleep(3000); if (stopFlag) return;
    }

    logStd(" ・音量");
    for (let v=0; v<=30; v+=5){
      await sleep(100); r = await apiGet(`/MP3/SET/VOLUME:1:${v}`);
      logStd(`  [${v}] ${(r.json&&r.json.ok)?"True":"False"}`);
      if (stopFlag) return;
      await sleep(1000); if (stopFlag) return;
    }

    await sleep(100); r = await apiGet(`/MP3/STOP:1`);
    logStd(` ・停止 :  ${r.json?r.json.value:"NaN"}`);
    logStd(" [終了]\n");
  }

  async function RunPwm(modeTrue){
    stopFlag = false;
    const title = modeTrue ? "５.ＰＷＭ" : "６.Ｉ２Ｃ";
    logStd(`${title}（ PCA9685：サーボモータ180度型,連続回転型 ）`);

    const SERVO_MIN=150, SERVO_MAX=600, SERVO_MID=(SERVO_MIN+SERVO_MAX)>>1;
    const OffsetMax360=60, STEPS=80, STEP=8, STEP_DELAY_MS=0;
    const CH_180=0, CH_360=15, PCA_ADDR_DEC=64;

    async function I2CWrite(reg, val){
      return apiGet(`/I2C/WRITE:${PCA_ADDR_DEC}:${reg}:${val}`);
    }
    async function RunI2C(ch, ticks){
      const base = 0x06 + 4*ch;
      await I2CWrite(base+2, (ticks    ) & 0xFF);
      await I2CWrite(base+3, (ticks >> 8) & 0x0F);
    }

    logStd(" ・初期位置");
    if (modeTrue){
      await apiGet(`/PWM/OUTPUT:${CH_180}:${SERVO_MID}`);
      await apiGet(`/PWM/OUTPUT:${CH_360}:${SERVO_MID}`);
    }else{
      await RunI2C(CH_180, SERVO_MID);
      await RunI2C(CH_360, SERVO_MID);
    }
    if (stopFlag) return;
    await sleep(300);

    logStd(" ・正転,加速");
    for (let i=0;i<=STEPS;i+=STEP){
      const pwm180 = SERVO_MIN + Math.floor((SERVO_MAX-SERVO_MIN)*i/STEPS);
      const pwm360 = SERVO_MID + Math.floor(OffsetMax360*i/STEPS);
      if (modeTrue){
        await apiGet(`/PWM/OUTPUT:${CH_180}:${pwm180}`);
        await apiGet(`/PWM/OUTPUT:${CH_360}:${pwm360}`);
      }else{
        await RunI2C(CH_180, pwm180);
        await RunI2C(CH_360, pwm360);
      }
      if (stopFlag) return;
      if (STEP_DELAY_MS) await sleep(STEP_DELAY_MS);
    }

    logStd(" ・逆転,減速");
    for (let i=STEPS;i>=0;i-=STEP){
      const pwm180 = SERVO_MIN + Math.floor((SERVO_MAX-SERVO_MIN)*i/STEPS);
      const pwm360 = SERVO_MID + Math.floor(OffsetMax360*i/STEPS);
      if (modeTrue){
        await apiGet(`/PWM/OUTPUT:${CH_180}:${pwm180}`);
        await apiGet(`/PWM/OUTPUT:${CH_360}:${pwm360}`);
      }else{
        await RunI2C(CH_180, pwm180);
        await RunI2C(CH_360, pwm360);
      }
      if (stopFlag) return;
      if (STEP_DELAY_MS) await sleep(STEP_DELAY_MS);
    }

    logStd(" ・初期位置");
    if (modeTrue){
      await apiGet(`/PWM/OUTPUT:${CH_180}:${SERVO_MID}`);
      await apiGet(`/PWM/OUTPUT:${CH_360}:${SERVO_MID}`);
    }else{
      await RunI2C(CH_180, SERVO_MID);
      await RunI2C(CH_360, SERVO_MID);
    }
    logStd(" [終了]\n");
  }

  async function Info(){
    await apiGet('/SYS/VERSION');
  }

  // ===== UI Wiring =====
  $('#btnAnalog' ).onclick = () => RunAnalog();
  $('#btnDigital').onclick = () => RunDigital();
  $('#btnMp3List').onclick = () => RunMp3Playlist();
  $('#btnMp3Ctrl').onclick = () => RunMp3Control();
  $('#btnPwm'    ).onclick = () => RunPwm(true);
  $('#btnPwmI2C' ).onclick = () => RunPwm(false);

  $('#btnStop'     ).onclick = () => { stopFlag = true; };
  $('#btnClearStd' ).onclick = () => { stdEl.textContent = ""; };
  $('#btnClearDtl' ).onclick = () => { detailEl.textContent = ""; };
  $('#btnInfo'     ).onclick = () => Info();

  updateModeUI();
})();
</script>
